# KOKI — nginx server block for koki.wisdombusara.com
# Install on the VPS as /etc/nginx/sites-available/koki.wisdombusara.com,
# symlink into sites-enabled, `nginx -t`, then reload.
#
# KOKI is a SINGLE Next.js app: pages, server actions, and /api/* are all served
# by one process. So there is only one upstream — no separate backend like
# LoadForge. Pick a loopback port that is free on this box (LoadForge uses 3002
# and 7331); this file assumes 3010. Confirm with:  ss -ltnp | grep 3010

server {
    listen 80;
    server_name koki.wisdombusara.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name koki.wisdombusara.com;

    # Reuse the shared Cloudflare wildcard origin cert (*.wisdombusara.com),
    # already present for lfg.wisdombusara.com. SSL/TLS mode = Full (strict).
    ssl_certificate     /etc/ssl/cloudflare/wisdombusara.pem;
    ssl_certificate_key /etc/ssl/cloudflare/wisdombusara.key;

    # Let Next stream large responses and keep the real client IP / scheme.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # One upstream for everything: pages, server actions, and /api/* (incl. the
    # M-Pesa callback at /api/mpesa/callback).
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Immutable Next build assets can be cached hard at the edge/origin.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
